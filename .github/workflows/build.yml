name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: fabric-1.20.1
            gradle_java: 25
          - project: forge-1.20.1
            gradle_java: 21
          - project: fabric-1.21.1
            gradle_java: 25
          - project: neoforge-1.21.1
            gradle_java: 21
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      # Each project compiles for its own Java (17 for 1.20.1, 21 for 1.21.1).
      # Gradle itself: Fabric Loom 1.18 needs Java 25; ForgeGradle / NeoForge run on 21.
      - name: Pick the Java that runs Gradle
        run: echo "JAVA_HOME=$JAVA_HOME_${{ matrix.gradle_java }}_X64" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        working-directory: ${{ matrix.project }}
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Collect jar
        run: |
          mkdir -p out
          find "${{ matrix.project }}/build/libs" -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-dev*.jar' ! -name '*-slim.jar' \
            -exec cp {} out/ \;
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}
          path: out/*.jar
          if-no-files-found: error

  release:
    name: Create the GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: jars
          merge-multiple: true
      - name: Create the release with the jars
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" jars/*.jar --title "${{ github.ref_name }}" --notes-file release-notes.md --repo "${{ github.repository }}"

  publish:
    name: Publish ${{ matrix.project }}
    needs: build
    # Runs only after the Modrinth / CurseForge IDs are set as repository variables
    # and the tokens as repository secrets (MODRINTH_TOKEN, CURSEFORGE_TOKEN).
    if: startsWith(github.ref, 'refs/tags/v') && (vars.MODRINTH_ID != '' || vars.CURSEFORGE_ID != '')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: fabric-1.20.1
            loaders: fabric
            game: 1.20.1
            java: 17
            deps: fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
          - project: forge-1.20.1
            loaders: forge
            game: 1.20.1
            java: 17
          - project: fabric-1.21.1
            loaders: fabric
            game: 1.21.1
            java: 21
            deps: fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
          - project: neoforge-1.21.1
            loaders: neoforge
            game: 1.21.1
            java: 21
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.project }}
          path: jar

      - uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: jar/*.jar
          name: Nether Star Crafting ${{ github.ref_name }} (${{ matrix.project }})
          version: ${{ github.ref_name }}+${{ matrix.project }}
          version-type: release
          changelog-file: release-notes.md
          loaders: ${{ matrix.loaders }}
          game-versions: ${{ matrix.game }}
          java: ${{ matrix.java }}
          dependencies: ${{ matrix.deps }}

  dist:
    name: Push jars to the dist branch
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: jars
          merge-multiple: true
      - name: Commit the latest jars to the dist branch
        run: |
          cd jars
          sha256sum *.jar > SHA256SUMS
          git init -q -b dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Jars built from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" dist
